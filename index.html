<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Rock Paper Scissors</h1>

        <div class="weapon-box">
            <h3>Select your Weapon</h3>
            <div class="weapons">
                <div class="Rock">
                    <img src="image/Rock.png" alt="rock">
                </div>
                <div class="Paper">
                    <img src="image/Paper.png" alt="paper">
                </div>
                <div class="Scissors">
                    <img src="image/Scissors.png" alt="scissors">
                </div>
            </div>
        </div>

        <div class="choices">
            <h3>Player <span>v/s</span> Computer</h3>
            <div class="player-choice">
                <img src="image/Rock.png" alt="">
            </div>
            <div class="computer-choice">
                <img src="image/Rock.png" alt="">
            </div>
        </div>

        <div class="result-box">
            <h3>Congrats, You Won! &#x1F389;</h3>
            <button class="play-again">&#x21BB; Play Again</button>
        </div>

        <div class="score-box">
            <div class="won">
                <h3>Won : <span>0</span></h3>
            </div>
            <div class="lost">
                <h3>Lost : <span>0</span></h3>
            </div>
            <div class="draw">
                <h3>Draw : <span>0</span></h3>
            </div>
        </div>

    </div>
    <script src="index.js"></script>
</body>
</html>
